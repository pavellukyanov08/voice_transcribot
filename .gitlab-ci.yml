stages:
  - build
  - deploy

variables:
  IMAGE: registry.gitlab.com/pavellukyanov08/voice_transcribot

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE:$CI_COMMIT_SHA .
    - docker push $IMAGE:$CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/amedia_first_serv
    - chmod 600 ~/.ssh/amedia_first_serv
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/amedia_first_serv deploy@$SERVER_IP \
        "CI_JOB_TOKEN=$CI_JOB_TOKEN \
         /home/deploy/voice_transcribot/deploy.sh $CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'