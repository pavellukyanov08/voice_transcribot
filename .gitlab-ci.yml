stages:
  - build
  - deploy

variables:
  IMAGE: registry.gitlab.com/pavellukyanov08/voice_transcribot

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE:$CI_COMMIT_SHA .
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker tag $IMAGE:$CI_COMMIT_SHA $IMAGE:latest
    - docker push $IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/gitlab_cicd_deploy
    - chmod 600 ~/.ssh/gitlab_cicd_deploy
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -i ~/.ssh/gitlab_cicd_deploy deploy@$SERVER_IP "
        set -e &&
        cd /home/voice_transcribot &&
        docker login registry.gitlab.com -u gitlab-ci-token -p $CI_JOB_TOKEN &&
        docker compose pull &&
        docker compose up -d
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'